<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2563eb">

  <!-- PWA manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">

  <!-- iOS standalone hints -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Student Payment">
  <meta name="application-name" content="Student Payment">

  <title>បង់គួរសិស្សប្រចាំថ្ងៃ</title>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      /* iPhone safe area */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    #app-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      opacity: 0;
      transition: opacity .25s ease;
    }
    #app-frame.ready { opacity: 1; }

    /* Loading splash — shows until the iframe loads */
    #splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
      z-index: 10;
      transition: opacity .3s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }

    .splash-icon {
      width: 84px; height: 84px;
      border-radius: 20px;
      background: rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1rem;
      animation: float 2s ease-in-out infinite;
    }
    .splash-icon img { width: 60px; height: 60px; }

    .splash-title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: .35rem;
    }
    .splash-sub {
      font-size: .82rem;
      opacity: .75;
      margin-bottom: 1.25rem;
    }

    .spinner {
      width: 28px; height: 28px;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Standalone tweak — when installed, drop the safe area top padding
       (the OS handles the status bar) */
    @media (display-mode: standalone) {
      html, body { padding-top: 0; }
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-icon">
      <img src="./icon.svg" alt="">
    </div>
    <div class="splash-title" id="splash-title">Student Daily Payment</div>
    <div class="splash-sub" id="splash-sub">Loading…</div>
    <div class="spinner"></div>
  </div>

  <iframe
    id="app-frame"
    src="ABOUT_BLANK_PLACEHOLDER"
    allow="fullscreen; autoplay; clipboard-read; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
    sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals allow-downloads allow-storage-access-by-user-activation">
  </iframe>

  <script>
    // ============================================================
    //  CONFIG — REPLACE THIS with your Apps Script /exec URL
    // ============================================================
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-xieWktwwPS1mGpwHnusaZFWC63IvpublUILBfEWPjoL84fHy5nfshoJvIjAYC3BF/exec';
    // ============================================================

    // Point the iframe at the app
    var frame = document.getElementById('app-frame');
    frame.src = APPS_SCRIPT_URL + '?page=dashboard';

    // Fade in the iframe once it loads, then hide the splash
    frame.addEventListener('load', function () {
      frame.classList.add('ready');
      setTimeout(function () {
        var s = document.getElementById('splash');
        if (s) s.classList.add('hide');
      }, 200);
    });

    // Safety: hide the splash after 8s even if load event misfires
    setTimeout(function () {
      var s = document.getElementById('splash');
      if (s) s.classList.add('hide');
      frame.classList.add('ready');
    }, 8000);

    // Register service worker (required for Chrome installability)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.warn('SW registration failed:', err);
        });
      });
    }

    // Handle iOS swipe-back gestures gracefully (avoid the iframe going "blank")
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) {
        frame.src = APPS_SCRIPT_URL + '?page=dashboard';
      }
    });
  </script>
</body>
</html>
